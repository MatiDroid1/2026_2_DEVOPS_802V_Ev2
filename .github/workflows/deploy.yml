name: Musica CI-CD - Calidad ECR y EKS

on:
  workflow_dispatch:
  push:
    branches:
      - ev3-kubernetes
      - main
    paths-ignore:
      - '**/*.md'
      - '.vscode/**'
      - '.github/workflows/verificar-aws.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: musica-eks-production
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_PAGER: ""
  ECR_REGISTRY: 932861612697.dkr.ecr.us-east-1.amazonaws.com

jobs:
  calidad:
    name: Pruebas JaCoCo Snyk y Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      coverage: ${{ steps.coverage.outputs.value }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas y validar cobertura mínima
        working-directory: musica
        run: mvn -B clean verify

      - name: Leer cobertura de líneas JaCoCo
        id: coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("musica/target/site/jacoco/jacoco.xml").getroot()
          counter = root.find("./counter[@type='LINE']")
          if counter is None:
              raise SystemExit("ERROR: no hay contador LINE en JaCoCo")

          covered = int(counter.attrib["covered"])
          missed = int(counter.attrib["missed"])
          total = covered + missed
          if total == 0:
              raise SystemExit("ERROR: JaCoCo no reportó líneas analizables")

          coverage = round(100 * covered / total, 2)
          print(f"Cobertura de líneas: {coverage}%")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"value={coverage}\n")
          PY

      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-jacoco
          path: |
            musica/target/site/jacoco/
            musica/target/surefire-reports/
          if-no-files-found: warn

      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce

      - name: Bloquear vulnerabilidades altas y críticas
        working-directory: musica
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=pom.xml \
            --policy-path=.snyk \
            --severity-threshold=high \
            --json-file-output=snyk-report.json

      - name: Publicar reporte Snyk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: musica/snyk-report.json
          if-no-files-found: warn

      - name: Analizar con Sonar y esperar Quality Gate
        working-directory: musica
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          set -euo pipefail

          test -n "$SONAR_TOKEN"
          test -n "$SONAR_PROJECT_KEY"
          test -n "$SONAR_ORGANIZATION"

          mvn -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  deploy:
    name: Publicar ECR y desplegar EKS
    needs: calidad
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/ev3-kubernetes' ||
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      IMAGE_TAG: ev3-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar identidad AWS y repositorios ECR
        shell: bash
        run: |
          set -euo pipefail

          ARN=$(aws sts get-caller-identity --query Arn --output text)
          echo "$ARN"

          case "$ARN" in
            arn:aws:sts::932861612697:assumed-role/voclabs/*) ;;
            *)
              echo "ERROR: identidad AWS inesperada"
              exit 1
              ;;
          esac

          aws ecr describe-repositories \
            --repository-names musica-backend musica-frontend \
            --query 'repositories[].repositoryUri' \
            --output table

      - name: Publicar cobertura en CloudWatch
        env:
          COVERAGE: ${{ needs.calidad.outputs.coverage }}
        run: |
          aws cloudwatch put-metric-data \
            --namespace Musica/CICD \
            --metric-data \
            "MetricName=LineCoverage,Dimensions=[{Name=Application,Value=musica}],Value=$COVERAGE,Unit=Percent"

      - name: Autenticar Docker en ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password |
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

      - name: Construir y publicar backend
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -f musica/Dockerfile \
            -t "$ECR_REGISTRY/musica-backend:$IMAGE_TAG" \
            ./musica

          docker push "$ECR_REGISTRY/musica-backend:$IMAGE_TAG"

      - name: Construir y publicar frontend
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -f frontend/Dockerfile \
            -t "$ECR_REGISTRY/musica-frontend:$IMAGE_TAG" \
            .

          docker push "$ECR_REGISTRY/musica-frontend:$IMAGE_TAG"

      - name: Desplegar en EKS por SSH
        shell: bash
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          set -euo pipefail

          SSH_DIR=$(mktemp -d)
          trap 'rm -rf "$SSH_DIR"' EXIT

          printf '%s\n' "$AWS_SSH_KEY" | tr -d '\r' > "$SSH_DIR/key"
          chmod 600 "$SSH_DIR/key"

          printf '%s ssh-ed25519 %s\n' \
            "$AWS_HOST" \
            'AAAAC3NzaC1lZDI1NTE5AAAAIOeV1z7JsHRRYuNO5Ibr9V9SISuGQqGy6X1IBE0DEb5h' \
            > "$SSH_DIR/known_hosts"

          {
            printf 'export AWS_ACCESS_KEY_ID=%q\n' "$AWS_ACCESS_KEY_ID"
            printf 'export AWS_SECRET_ACCESS_KEY=%q\n' "$AWS_SECRET_ACCESS_KEY"
            printf 'export AWS_SESSION_TOKEN=%q\n' "$AWS_SESSION_TOKEN"
            printf 'export ECR_REGISTRY=%q\n' "$ECR_REGISTRY"
            printf 'export IMAGE_TAG=%q\n' "$IMAGE_TAG"

            cat <<'REMOTE'
          set -euo pipefail
          export AWS_DEFAULT_REGION=us-east-1
          export AWS_PAGER=""

          WORK_DIR=$(mktemp -d)
          trap 'rm -rf "$WORK_DIR"' EXIT
          export KUBECONFIG="$WORK_DIR/kubeconfig"

          aws eks update-kubeconfig \
            --name musica-ev3-v2 \
            --kubeconfig "$KUBECONFIG"

          echo "=== ESTADO ANTERIOR ==="
          kubectl get deployments -n musica
          kubectl get deployments -n musica -o yaml \
            > "$WORK_DIR/deployments-anteriores.yaml"

          START=$(date +%s)

          kubectl set image deployment/musica-backend \
            backend="$ECR_REGISTRY/musica-backend:$IMAGE_TAG" \
            -n musica

          kubectl rollout status deployment/musica-backend \
            -n musica --timeout=300s

          kubectl set image deployment/musica-frontend \
            frontend="$ECR_REGISTRY/musica-frontend:$IMAGE_TAG" \
            -n musica

          kubectl rollout status deployment/musica-frontend \
            -n musica --timeout=300s

          DURATION=$(( $(date +%s) - START ))

          echo "=== ESTADO FINAL ==="
          kubectl get deployments,pods -n musica

          echo "Duración de actualización y rollout: $DURATION segundos"

          aws cloudwatch put-metric-data \
            --namespace Musica/CICD \
            --metric-data \
            "MetricName=DeploymentDuration,Dimensions=[{Name=Application,Value=musica}],Value=$DURATION,Unit=Seconds"

          echo "DESPLIEGUE EKS COMPLETADO"
          REMOTE
          } | ssh \
            -i "$SSH_DIR/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "$AWS_USER@$AWS_HOST" \
            'bash -s'

      - name: Cerrar sesión Docker
        if: always()
        run: docker logout "$ECR_REGISTRY"